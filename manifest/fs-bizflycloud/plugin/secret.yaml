# Secret for Bizfly Cloud authentication
# This is shared with the block volume CSI driver.
# If you already have the 'bizflycloud' secret deployed in kube-system namespace, you can skip this file.
apiVersion: v1
kind: Secret
metadata:
  name: bizflycloud
  namespace: kube-system
stringData:
  application_credential_id: "<your_application_credential_id>"
  application_credential_secret: "<your_application_credential_secret>"
  tenant_id: "<your_tenant_id>"
  region: "HaNoi" # HaNoi or HoChiMinh
  api_url: "https://manage.bizflycloud.vn"

